name: web-search check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  check:
    name: check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .pi/extensions

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: .pi/extensions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Version consistency
        working-directory: .pi/extensions/web-search
        run: node scripts/check-version.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Pack and smoke-install
        working-directory: .pi/extensions/web-search
        run: |
          npm pack --pack-destination /tmp
          TARBALL=$(ls /tmp/svenhornaff-web-search-*.tgz | head -1)
          mkdir -p /tmp/pi-web-search-smoke
          cd /tmp/pi-web-search-smoke
          npm init -y
          # Install the packed tarball and jiti (pi's TS loader for node_modules)
          npm install "$TARBALL" jiti
          # Smoke-import via jiti — same mechanism pi uses to load extensions
          node --input-type=module <<'EOF'
          import { createJiti } from "jiti";
          const jiti = createJiti(import.meta.url);
          await jiti.import("@svenhornaff/web-search");
          console.log("smoke import OK (jiti)");
          EOF
