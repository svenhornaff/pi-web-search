name: web-search check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  check:
    name: check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .pi/extensions

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: .pi/extensions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Version consistency
        working-directory: .pi/extensions/web-search
        run: node scripts/check-version.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
