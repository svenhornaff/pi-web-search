[project]
name = "pi-web-search"
version = "0.1.0"
description = "simple text client for pi search engine"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.1.2",
  "flask-cors>=6.0.2",
  "flask-migrate>=4.1.0",
  "flask-restx>=1.3.2",
  "flask-sqlalchemy>=3.1.1",
  "gunicorn>=22.0.0",
  "pydantic>=2.12.5",
  "pydantic-settings>=2.12.0",
  "requests>=2.32.5",
]


[dependency-groups]
dev = ["ruff>=0.9.0", "pyright>=1.1.400", "pytest>=8.4.1", "pytest-cov>=7.1.0"]
security = [
  "bandit>=1.8.6",
  "semgrep",
  "detect-secrets",
  "safety",
  "pip-audit",
  "cyclonedx-bom",
  "pip-licenses",
  "radon",
  "pre-commit",
]

# ── Lint / format ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 140
target-version = "py312"
exclude = ["migrations", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # allow assert in tests

[tool.ruff.format]
quote-style = "double"

# ── Types ─────────────────────────────────────────────────────────────────────
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["app"]
exclude = ["tests", "migrations"]

# ── SAST ──────────────────────────────────────────────────────────────────────
[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

# ── Tests + coverage gate ─────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--tb=short",
  "--import-mode=importlib",
  "--cov=app",
  "--cov-report=term-missing",
  "--cov-report=html",
  "--cov-fail-under=80",       # build fails below 80% — CRA audit evidence
]
markers = [
  "unit: no external dependencies",
  "integration: database or external services",
  "slow: long running tests",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/migrations/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
]
